<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Login | STONAD</title><link rel="stylesheet" href="css/style.css"></head>
<body class="form-page">
<div class="form-card">
    <a class="logo" href="index.html">STONAD</a>
    <h1>Welcome back</h1>
    <p>Login to continue exploring or showcasing art.</p>
    <form action="login" method="post">
        <input name="email" type="email" placeholder="Email" required>
        <input name="password" type="password" placeholder="Password" required>
        <button class="btn" type="submit">Login</button>
    </form>
    <p>New to STONAD? <a href="register.html">Create account</a></p>
</div>
</body>
</html>
